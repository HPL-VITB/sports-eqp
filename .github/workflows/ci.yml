name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      APP_ORIGIN: http://localhost:3000
      OTP_HMAC_SECRET: ci-only-secret-ci-only-secret-ci-only-secret
      MAIL_TRANSPORT: console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Switch to "npm ci" once package-lock.json is committed (generated by the first "npm install").
      - run: npm install
      - run: npm test
      - run: npm run typecheck:pages # pages against React/Next stand-ins (fast, no build)
      - run: npm run check:pages     # renders every page for every role + accessibility checks
      - run: npm run db:migrate
      - run: npm run build # generates next-env.d.ts and type-checks pages
      - run: npm run typecheck
